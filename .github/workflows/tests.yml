name: Tests

# Green only once oryxflow 26.11.6 is on PyPI (oryxeval needs oryxflow>=26.11.6).
# Matrix: Python 3.10 and 3.13 x {latest oryxflow, the floor oryxflow==26.11.6}.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
        oryxflow: ['oryxflow', 'oryxflow==26.11.6']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]"
          pip install --upgrade "${{ matrix.oryxflow }}"

      - name: Test
        run: python -m pytest tests -q
